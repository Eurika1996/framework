用例类型: ApiCase
用例标题: 健康检查
一级模块: 健康检查与服务管理
二级模块: 服务状态
用例步骤:
  - 请求健康检查接口:
      操作类型: 发送请求GET
      请求地址: /api/health
  - 断言状态码200:
      操作类型: 断言状态码
      预期结果: 200
  - 断言健康状态为ok:
      操作类型: 提取JSON
      表达式: $.status
      变量名: health_status
  - 验证status字段:
      操作类型: 断言文本
      预期结果: ok
      实际结果: "{{health_status}}"
      比较符: "=="
