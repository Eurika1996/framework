用例类型: ApiCase
用例标题: 列出数据集文件
一级模块: 数据集管理
二级模块: 文件管理
用例步骤:
  - 获取文件列表:
      操作类型: 发送请求POST
      请求地址: /api/datasets/files
      请求数据:
        dataset: local/test-dataset
        path: ""
  - 断言状态码:
      操作类型: 断言状态码
      预期结果: 200
