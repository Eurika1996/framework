用例类型: ApiCase
用例标题: 列出本地数据集
一级模块: 数据集管理
二级模块: 数据集查询
用例步骤:
  - 获取数据集列表:
      操作类型: 发送请求GET
      请求地址: /api/datasets
  - 断言状态码:
      操作类型: 断言状态码
      预期结果: 200
---
用例类型: ApiCase
用例标题: 搜索本地数据集
一级模块: 数据集管理
二级模块: 数据集查询
用例步骤:
  - 搜索数据集:
      操作类型: 发送请求GET
      请求地址: /api/datasets/search
      URL参数:
        q: test
        limit: 10
  - 断言状态码:
      操作类型: 断言状态码
      预期结果: 200
---
用例类型: ApiCase
用例标题: 下载数据集 - SSE流式
一级模块: 数据集管理
二级模块: 数据集下载
用例步骤:
  - 拉取数据集:
      操作类型: 发送请求POST
      请求地址: /api/datasets/pull
      请求数据:
        dataset: Qwen/Qwen3-0.6B-GGUF
      请求头:
        Accept: text/event-stream
      流式: true
  - 断言状态码:
      操作类型: 断言状态码
      预期结果: 200
