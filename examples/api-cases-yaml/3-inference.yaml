用例类型: ApiCase
用例标题: 对话补全 - 流式
一级模块: 推理接口
二级模块: 对话补全
用例步骤:
  - 发起对话请求:
      操作类型: 发送请求POST
      请求地址: /api/chat
      请求数据:
        model: "{{TEST_MODEL}}"
        messages:
          - role: user
            content: Hello
        stream: true
      请求头:
        Accept: text/event-stream
      流式: true
  - 断言状态码:
      操作类型: 断言状态码
      预期结果: 200
