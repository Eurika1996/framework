用例类型: ApiCase
用例标题: 下载模型 - SSE流式
一级模块: 模型管理
二级模块: 模型下载
用例步骤:
  - 拉取模型:
      操作类型: 发送请求POST
      请求地址: /api/pull
      请求数据:
        model: "{{TEST_MODEL}}"
      请求头:
        Accept: text/event-stream
      流式: true
  - 断言状态码:
      操作类型: 断言状态码
      预期结果: 200
---
用例类型: ApiCase
用例标题: 预加载模型
一级模块: 模型管理
二级模块: 模型加载
用例步骤:
  - 加载模型:
      操作类型: 发送请求POST
      请求地址: /api/load
      请求数据:
        model: "{{TEST_MODEL}}"
        stream: false
        num_ctx: 4096
  - 断言状态码:
      操作类型: 断言状态码
      预期结果: 200
