用例类型: ApiCase
用例标题: 列出可用模型
一级模块: 模型管理
二级模块: 模型查询
用例步骤:
  - 获取模型列表:
      操作类型: 发送请求GET
      请求地址: /api/tags
  - 断言状态码:
      操作类型: 断言状态码
      预期结果: 200
  - 提取models字段:
      操作类型: 提取JSON
      表达式: $.models
      变量名: model_list
  - 断言返回models字段:
      操作类型: 断言文本
      预期结果: ""
      实际结果: "{{model_list}}"
      比较符: "!="
