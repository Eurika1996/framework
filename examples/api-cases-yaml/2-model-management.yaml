用例类型: ApiCase
用例标题: 创建上传会话
一级模块: 模型管理
二级模块: 文件上传
用例步骤:
  - 创建上传会话:
      操作类型: 发送请求POST
      请求地址: /api/models/upload/start
      请求数据:
        model: local/test-model
        total_files: 1
  - 断言状态码:
      操作类型: 断言状态码
      预期结果: 200
  - 提取upload_id:
      操作类型: 提取JSON
      表达式: $.upload_id
      变量名: upload_session_id
  - 验证upload_id存在:
      操作类型: 断言文本
      预期结果: ""
      实际结果: "{{upload_session_id}}"
      比较符: "!="
