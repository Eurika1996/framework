session_reuse: True
key_dir: ./HAT/key_dir

# ============================================
# 浏览器配置
# ============================================
_浏览器:
  capability:
    browserName: "chrome"
  options:
    args:
      - "--disable-gpu"
      - "--no-sandbox"
      - "--start-maximized"

# ============================================
# 测试环境配置
# ============================================
base_url: "http://127.0.0.1:18080"
test_agent_name: "测试智能体-AutoTest"
test_agent_desc: "由自动化测试创建的测试智能体，用于验证系统功能"
test_room_name: "测试房间-AutoTest"
test_hub_name: "测试Hub-AutoTest"
test_message: "你好，请介绍一下自己。"
test_user_name: "测试用户"

# ============================================
# 全局页面元素定位（按模块分类）
# ============================================
_WEB页面元素:

  # ---------- 导航与全局元素 ----------
  页面标题:
    定位方式: css
    目标对象: ".panel.active h1"
  侧边栏导航:
    定位方式: css
    目标对象: "nav[role='navigation']"
  新建按钮:
    定位方式: css
    目标对象: ".panel.active .btn-create"
  删除确认按钮:
    定位方式: css
    目标对象: "#delete-modal .btn-danger"
  取消按钮:
    定位方式: css
    目标对象: ".panel.active .btn-secondary"
  页面加载中提示:
    定位方式: css
    目标对象: ".panel.active .empty-state"

  # ---------- Agent/智能体页面元素 ----------
  Agent_导航链接:
    定位方式: css
    目标对象: "a[data-panel='agents']"
  Agent_列表容器:
    定位方式: css
    目标对象: "#panel-agents .agent-list"
  Agent_列表项:
    定位方式: css
    目标对象: "#panel-agents .agent-item"
  Agent_名称输入框:
    定位方式: css
    目标对象: "#panel-agents input[name='name']"
  Agent_描述输入框:
    定位方式: css
    目标对象: "#panel-agents textarea[name='description']"
  Agent_保存按钮:
    定位方式: css
    目标对象: "#panel-agents .btn-primary"
  Agent_删除按钮:
    定位方式: css
    目标对象: "#panel-agents .agent-item .action-btn.delete"
  Agent_编辑按钮:
    定位方式: css
    目标对象: "#panel-agents .agent-item .action-btn.edit-btn"
  Agent_详情面板:
    定位方式: css
    目标对象: "#panel-agents .detail-pane"
  Agent_空列表提示:
    定位方式: css
    目标对象: "#panel-agents .empty-state"

  # ---------- Conversation/对话页面元素 ----------
  对话_导航链接:
    定位方式: css
    目标对象: "a[data-panel='chat']"
  对话_消息列表:
    定位方式: css
    目标对象: "#panel-chat .message-list"
  对话_消息项:
    定位方式: css
    目标对象: "#panel-chat .message-item"
  对话_消息输入框:
    定位方式: css
    目标对象: "#panel-chat textarea[name='message']"
  对话_发送按钮:
    定位方式: css
    目标对象: "#panel-chat .send-btn"
  对话_用户消息:
    定位方式: css
    目标对象: "#panel-chat .user-message"
  对话_AI消息:
    定位方式: css
    目标对象: "#panel-chat .agent-message"
  对话_新房间按钮:
    定位方式: css
    目标对象: "#panel-chat .btn-create"
  对话_正在输入提示:
    定位方式: css
    目标对象: "#panel-chat .typing-indicator"

  # ---------- Room/房间页面元素 ----------
  房间_导航链接:
    定位方式: css
    目标对象: "a[data-panel='rooms']"
  房间_列表容器:
    定位方式: css
    目标对象: "#panel-rooms .room-list"
  房间_列表项:
    定位方式: css
    目标对象: "#panel-rooms .room-item"
  房间_名称输入框:
    定位方式: css
    目标对象: "#panel-rooms input[name='roomName']"
  房间_保存按钮:
    定位方式: css
    目标对象: "#panel-rooms .btn-primary"
  房间_详情面板:
    定位方式: css
    目标对象: "#panel-rooms .detail-pane"

  # ---------- Hub页面元素 ----------
  Hub_导航链接:
    定位方式: css
    目标对象: "a[data-panel='hubs']"
  Hub_列表容器:
    定位方式: css
    目标对象: "#panel-hubs .hub-list"
  Hub_列表项:
    定位方式: css
    目标对象: "#panel-hubs .hub-item"
  Hub_名称输入框:
    定位方式: css
    目标对象: "#panel-hubs input[name='hubName']"
  Hub_保存按钮:
    定位方式: css
    目标对象: "#panel-hubs .btn-primary"
  Hub_详情面板:
    定位方式: css
    目标对象: "#panel-hubs .detail-pane"

  # ---------- Computer/计算机页面元素 ----------
  计算机_导航链接:
    定位方式: css
    目标对象: "a[data-panel='computer']"
  计算机_工作区信息:
    定位方式: css
    目标对象: "#panel-computer .detail-pane"
  计算机_工作区路径:
    定位方式: css
    目标对象: "#panel-computer .workspace-path"
  计算机_状态指示:
    定位方式: css
    目标对象: "#panel-computer .status-pill"

  # ---------- Human/用户页面元素 ----------
  用户_导航链接:
    定位方式: css
    目标对象: "a[data-panel='humans']"
  用户_列表容器:
    定位方式: css
    目标对象: "#panel-humans .human-list"
  用户_列表项:
    定位方式: css
    目标对象: "#panel-humans .list-item"
  用户_名称输入框:
    定位方式: css
    目标对象: "#panel-humans input[name='userName']"
  用户_保存按钮:
    定位方式: css
    目标对象: "#panel-humans .btn-primary"
