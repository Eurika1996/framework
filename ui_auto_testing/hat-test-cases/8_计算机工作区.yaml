基础配置:
  用例类型: WebCase
  一级模块: 计算机工作区
  二级模块: 工作区信息
  用例标题: 验证计算机工作区信息页面加载

前置脚本: ""

后置脚本: ""

用例步骤:
  - 步骤描述: 访问CSGClaw首页
    操作类型: 访问网址
    网址: "{{base_url}}/"

  - 步骤描述: 等待页面加载
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 点击计算机导航链接进入工作区页面
    操作类型: 点击元素
    _页面元素: 计算机_导航链接

  - 步骤描述: 等待工作区页面加载
    操作类型: 强制等待
    数据内容: "3"

  - 步骤描述: 获取工作区详情面板内容
    操作类型: 获取元素文本
    _页面元素: 计算机_工作区信息
    变量名: computer_detail

  - 步骤描述: 断言工作区信息面板有内容显示
    操作类型: 断言文本包含
    预期结果: ""
    实际结果: "{{computer_detail}}"

数据驱动:
  - description: 计算机工作区页面正常加载场景
