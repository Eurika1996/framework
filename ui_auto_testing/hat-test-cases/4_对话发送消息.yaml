基础配置:
  用例类型: WebCase
  一级模块: 对话功能
  二级模块: 对话页面
  用例标题: 验证对话页面加载与消息发送

前置脚本: ""

后置脚本: ""

用例步骤:
  - 步骤描述: 访问CSGClaw首页
    操作类型: 访问网址
    网址: "{{base_url}}/"

  - 步骤描述: 等待页面加载
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 点击对话导航链接进入对话页面
    操作类型: 点击元素
    _页面元素: 对话_导航链接

  - 步骤描述: 等待对话页面加载
    操作类型: 强制等待
    数据内容: "3"

  - 步骤描述: 在消息输入框中输入测试消息
    操作类型: 输入内容
    _页面元素: 对话_消息输入框
    数据内容: "{{test_message}}"

  - 步骤描述: 点击发送按钮发送消息
    操作类型: 点击元素
    _页面元素: 对话_发送按钮

  - 步骤描述: 等待消息发送与响应（等待AI响应）
    操作类型: 强制等待
    数据内容: "8"

  - 步骤描述: 获取消息列表内容验证消息已发送
    操作类型: 获取元素文本
    _页面元素: 对话_消息列表
    变量名: message_list_content

  - 步骤描述: 断言消息列表中包含用户发送的测试消息
    操作类型: 断言文本包含
    预期结果: "{{test_message}}"
    实际结果: "{{message_list_content}}"

数据驱动:
  - description: 发送消息并收到响应的正常场景
    test_message: "你好，请简单介绍一下你自己。"
