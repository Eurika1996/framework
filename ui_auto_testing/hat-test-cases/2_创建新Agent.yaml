基础配置:
  用例类型: WebCase
  一级模块: Agent管理
  二级模块: Agent创建
  用例标题: 验证创建新Agent功能

前置脚本: ""

后置脚本: ""

用例步骤:
  - 步骤描述: 访问CSGClaw首页
    操作类型: 访问网址
    网址: "{{base_url}}/"

  - 步骤描述: 等待页面加载
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 点击Agent导航链接进入Agent页面
    操作类型: 点击元素
    _页面元素: Agent_导航链接

  - 步骤描述: 等待Agent列表加载
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 点击新建按钮创建新Agent
    操作类型: 点击元素
    _页面元素: 新建按钮

  - 步骤描述: 等待表单显示
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 在名称输入框中输入Agent名称
    操作类型: 输入内容
    _页面元素: Agent_名称输入框
    数据内容: "{{test_agent_name}}"

  - 步骤描述: 在描述输入框中输入Agent描述
    操作类型: 输入内容
    _页面元素: Agent_描述输入框
    数据内容: "{{test_agent_desc}}"

  - 步骤描述: 点击保存按钮提交Agent
    操作类型: 点击元素
    _页面元素: Agent_保存按钮

  - 步骤描述: 等待保存完成与列表刷新
    操作类型: 强制等待
    数据内容: "3"

  - 步骤描述: 获取Agent列表内容验证新Agent已创建
    操作类型: 获取元素文本
    _页面元素: Agent_列表容器
    变量名: agent_list_after_create

  - 步骤描述: 断言列表中包含新创建的Agent名称
    操作类型: 断言文本包含
    预期结果: "{{test_agent_name}}"
    实际结果: "{{agent_list_after_create}}"

数据驱动:
  - description: 创建新Agent成功场景
    test_agent_name: "测试智能体-AutoTest"
    test_agent_desc: "由自动化测试创建的测试智能体，用于验证系统功能"
