基础配置:
  用例类型: WebCase
  一级模块: 房间管理
  二级模块: 房间列表与创建
  用例标题: 验证房间列表与新建房间功能

前置脚本: ""

后置脚本: ""

用例步骤:
  - 步骤描述: 访问CSGClaw首页
    操作类型: 访问网址
    网址: "{{base_url}}/"

  - 步骤描述: 等待页面加载
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 点击房间导航链接进入房间管理页面
    操作类型: 点击元素
    _页面元素: 房间_导航链接

  - 步骤描述: 等待房间列表加载
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 获取房间列表内容
    操作类型: 获取元素文本
    _页面元素: 房间_列表容器
    变量名: room_list_before

  - 步骤描述: 点击新建按钮创建新房间
    操作类型: 点击元素
    _页面元素: 新建按钮

  - 步骤描述: 等待表单显示
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 输入房间名称
    操作类型: 输入内容
    _页面元素: 房间_名称输入框
    数据内容: "{{test_room_name}}"

  - 步骤描述: 点击保存按钮
    操作类型: 点击元素
    _页面元素: 房间_保存按钮

  - 步骤描述: 等待房间创建完成
    操作类型: 强制等待
    数据内容: "3"

  - 步骤描述: 获取创建后的房间列表
    操作类型: 获取元素文本
    _页面元素: 房间_列表容器
    变量名: room_list_after

  - 步骤描述: 断言列表中包含新创建的房间名称
    操作类型: 断言文本包含
    预期结果: "{{test_room_name}}"
    实际结果: "{{room_list_after}}"

数据驱动:
  - description: 创建新房间成功场景
    test_room_name: "测试房间-AutoTest"
