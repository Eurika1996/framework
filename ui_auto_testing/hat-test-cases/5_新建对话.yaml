基础配置:
  用例类型: WebCase
  一级模块: 对话功能
  二级模块: 新建对话
  用例标题: 验证新建对话/房间功能

前置脚本: ""

后置脚本: ""

用例步骤:
  - 步骤描述: 访问CSGClaw首页
    操作类型: 访问网址
    网址: "{{base_url}}/"

  - 步骤描述: 等待页面加载
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 点击对话导航链接进入对话页面
    操作类型: 点击元素
    _页面元素: 对话_导航链接

  - 步骤描述: 等待对话页面加载
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 点击新建对话按钮
    操作类型: 点击元素
    _页面元素: 对话_新房间按钮

  - 步骤描述: 等待新对话创建
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 在消息输入框发送测试消息验证新对话
    操作类型: 输入内容
    _页面元素: 对话_消息输入框
    数据内容: "这是一条测试消息，用于验证新建对话功能。"

  - 步骤描述: 点击发送按钮
    操作类型: 点击元素
    _页面元素: 对话_发送按钮

  - 步骤描述: 等待消息响应
    操作类型: 强制等待
    数据内容: "5"

  - 步骤描述: 获取消息列表验证消息发送成功
    操作类型: 获取元素文本
    _页面元素: 对话_消息列表
    变量名: new_chat_messages

  - 步骤描述: 断言消息列表包含测试消息
    操作类型: 断言文本包含
    预期结果: "这是一条测试消息"
    实际结果: "{{new_chat_messages}}"

数据驱动:
  - description: 新建对话成功场景
