基础配置:
  用例类型: WebCase
  一级模块: 完整业务流程
  二级模块: 端到端测试
  用例标题: 完整端到端流程:启动服务->创建Agent->对话->查看结果

前置脚本: ""

后置脚本: ""

用例步骤:
  - 步骤描述: 访问CSGClaw首页
    操作类型: 访问网址
    网址: "{{base_url}}/"

  - 步骤描述: 等待页面加载完成
    操作类型: 强制等待
    数据内容: "3"

  - 步骤描述: 验证页面URL正确
    操作类型: 断言浏览器路径
    数据内容: "127.0.0.1"

  - 步骤描述: 进入Agent管理页面
    操作类型: 点击元素
    _页面元素: Agent_导航链接

  - 步骤描述: 等待Agent列表加载
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 点击新建按钮
    操作类型: 点击元素
    _页面元素: 新建按钮

  - 步骤描述: 等待创建表单
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 输入Agent名称
    操作类型: 输入内容
    _页面元素: Agent_名称输入框
    数据内容: "E2E测试智能体"

  - 步骤描述: 输入Agent描述
    操作类型: 输入内容
    _页面元素: Agent_描述输入框
    数据内容: "端到端测试专用Agent"

  - 步骤描述: 点击保存按钮提交
    操作类型: 点击元素
    _页面元素: Agent_保存按钮

  - 步骤描述: 等待Agent创建完成
    操作类型: 强制等待
    数据内容: "3"

  - 步骤描述: 验证Agent创建成功
    操作类型: 获取元素文本
    _页面元素: Agent_列表容器
    变量名: e2e_agent_list

  - 步骤描述: 断言列表包含新Agent名称
    操作类型: 断言文本包含
    预期结果: "E2E测试智能体"
    实际结果: "{{e2e_agent_list}}"

  - 步骤描述: 进入对话页面
    操作类型: 点击元素
    _页面元素: 对话_导航链接

  - 步骤描述: 等待对话页面加载
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 发送测试消息给AI
    操作类型: 输入内容
    _页面元素: 对话_消息输入框
    数据内容: "请帮我列出3个Python编程的最佳实践。"

  - 步骤描述: 点击发送按钮
    操作类型: 点击元素
    _页面元素: 对话_发送按钮

  - 步骤描述: 等待AI响应（较长等待时间）
    操作类型: 强制等待
    数据内容: "10"

  - 步骤描述: 获取消息列表内容
    操作类型: 获取元素文本
    _页面元素: 对话_消息列表
    变量名: e2e_messages

  - 步骤描述: 断言消息列表包含用户发送的消息
    操作类型: 断言文本包含
    预期结果: "Python编程的最佳实践"
    实际结果: "{{e2e_messages}}"

数据驱动:
  - description: 完整端到端流程测试
