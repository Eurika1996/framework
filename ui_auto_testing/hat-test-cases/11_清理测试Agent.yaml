基础配置:
  用例类型: WebCase
  一级模块: 清理测试
  二级模块: 删除流程验证
  用例标题: 验证Agent删除确认流程

前置脚本: ""

后置脚本: ""

用例步骤:
  - 步骤描述: 访问CSGClaw首页
    操作类型: 访问网址
    网址: "{{base_url}}/"

  - 步骤描述: 等待页面加载
    操作类型: 强制等待
    数据内容: "3"

  - 步骤描述: 进入Agent管理页面
    操作类型: 点击元素
    _页面元素: Agent_导航链接

  - 步骤描述: 等待Agent列表加载
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 点击列表项上的删除按钮
    操作类型: 点击元素
    _页面元素: Agent_删除按钮

  - 步骤描述: 等待删除确认对话框弹出
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 点击确认删除按钮执行删除
    操作类型: 点击元素
    _页面元素: 删除确认按钮

  - 步骤描述: 等待删除操作完成（对话框关闭）
    操作类型: 强制等待
    数据内容: "3"

  - 步骤描述: 再次点击Agent导航确保在Agent管理页面
    操作类型: 点击元素
    _页面元素: Agent_导航链接

  - 步骤描述: 等待页面状态恢复
    操作类型: 强制等待
    数据内容: "2"

  - 步骤描述: 验证页面仍在Agent管理区域（列表容器可正常访问）
    操作类型: 获取元素文本
    _页面元素: Agent_列表容器
    变量名: agent_list_content

  - 步骤描述: 验证页面标题表明是Agent管理页面
    操作类型: 获取元素文本
    _页面元素: 页面标题
    变量名: page_title

  - 步骤描述: 断言页面标题包含智能体管理标识
    操作类型: 断言文本包含
    预期结果: "智能体"
    实际结果: "{{page_title}}"

数据驱动:
  - description: Agent删除确认流程验证
